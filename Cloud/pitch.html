<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>STRDM Live — 3D Stage</title>
<style>
 html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}
 #hud{position:fixed;left:18px;top:14px;z-index:2;pointer-events:none}
 #hud .b{font-weight:900;letter-spacing:.16em;font-size:14px;background:linear-gradient(90deg,#ff3d81,#00e5ff);-webkit-background-clip:text;color:transparent}
 #hud h1{margin:4px 0 2px;font-size:26px;font-weight:900}
 #hud p{margin:0;opacity:.7;font-size:13px}
 #legend{position:fixed;right:14px;bottom:14px;z-index:2;font-size:11px;opacity:.7;text-align:right}
 #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
 img.logo{width:40px;height:40px;border-radius:10px;vertical-align:middle;margin-right:8px}
</style></head><body>
<div id="hud"><div><img class="logo" id="lg" alt="" style="display:none"><span class="b">STRDM LIVE · STAGE PITCH</span></div><h1 id="t">Loading stage…</h1><p id="s"></p></div>
<div id="legend">Drag to orbit · scroll / pinch to zoom · right-drag to pan</div>
<div id="err">This pitch link has expired or doesn't exist.</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const id = location.pathname.split("/p/")[1] || new URLSearchParams(location.search).get("id");
const res = await fetch("/api/pitch?id=" + id);
if (!res.ok) { document.getElementById("err").style.display = "flex"; throw 0; }
const d = await res.json();
document.getElementById("t").textContent = d.title || "Stage";
document.getElementById("s").textContent = d.subtitle || "";
if (d.logo) { const l = document.getElementById("lg"); l.src = d.logo; l.style.display = ""; }
const W = d.width, D = d.depth, H = d.deck ?? 1.2;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x05050a, 0.012);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
cam.position.set(W * 0.15, H + Math.max(W, D) * 0.45, D * 0.5 + Math.max(W, D) * 0.95);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(0, H + 1.5, -D * 0.1); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 0.4;
renderer.domElement.addEventListener("pointerdown", () => ctl.autoRotate = false);
scene.add(new THREE.HemisphereLight(0x8899ff, 0x110011, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.6); key.position.set(5, 20, 15); scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const deck = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.7 }));
deck.position.set(0, H / 2, 0); scene.add(deck);
const P = (x, y) => [x - W / 2, -(y - D / 2)];   // stage metres → scene
const pal = (d.colors && d.colors.length ? d.colors : ["#ff3d81", "#00e5ff"]).map(c => new THREE.Color(c));
function ledTexture(w, h) {
  const c = document.createElement("canvas"); c.width = 512; c.height = Math.max(64, Math.round(512 * h / Math.max(0.1, w)));
  const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, c.width, c.height);
  gr.addColorStop(0, "#ff3d81"); gr.addColorStop(0.5, "#3a0a6a"); gr.addColorStop(1, "#00e5ff"); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "rgba(255,255,255,.95)"; g.font = "900 " + Math.round(c.height * 0.22) + "px -apple-system,sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(d.artist || "STRDM LIVE", c.width / 2, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const kindColor = { riser: 0x2a2420, drumRiser: 0x2a2420, bStage: 0x1a1a22, catwalk: 0x1a1a22, roundRiser: 0x2a2420, stairs: 0x333333, ramp: 0x333333,
  setPiece: 0x5a2a6a, scrim: 0x666688, lineArray: 0x111111, sideFill: 0x111111, monitorWedge: 0x111111, drums: 0x888888, djBooth: 0x222222,
  keys: 0x222222, guitarAmp: 0x111111, bassAmp: 0x111111, playback: 0x222222, percussion: 0x555555, horns: 0x777755 };
for (const it of d.items) {
  const [x, z] = P(it.x, it.y); const base = H + (it.elevation || 0);
  const h = Math.max(0.05, it.height || 0.3);
  if (it.kind === "person") {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.2, 4, 8), new THREE.MeshStandardMaterial({ color: 0xff3d81, emissive: 0x330011 }));
    m.position.set(x, base + 0.85, z); scene.add(m); continue;
  }
  if (it.kind === "truss" || it.kind === "trussTower") {
    const geo = it.kind === "truss" ? new THREE.BoxGeometry(it.width, 0.4, 0.4) : new THREE.BoxGeometry(0.4, h, 0.4);
    const m = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xbbbbcc }));
    m.position.set(x, it.kind === "truss" ? H + h : base + h / 2, z); m.rotation.y = -(it.rotation || 0) * Math.PI / 180; scene.add(m); continue;
  }
  if (it.kind === "ledWall") {
    const wallH = Math.max(1, h - (it.elevation || 0));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(it.width, wallH), new THREE.MeshBasicMaterial({ map: ledTexture(it.width, wallH) }));
    m.position.set(x, base + wallH / 2, z + 0.05); m.rotation.y = -(it.rotation || 0) * Math.PI / 180; scene.add(m);
    const glow = new THREE.PointLight(0xff3d81, 2, 15); glow.position.set(x, base + wallH / 2, z + 2); scene.add(glow); continue;
  }
  if (it.kind === "ledFloor") {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(it.width, it.depth), new THREE.MeshBasicMaterial({ map: ledTexture(it.width, it.depth) }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, H + 0.02, z); scene.add(m); continue;
  }
  if (it.kind === "scenic") {
    const off = it.x < 0 || it.x > W || it.y < 0 || it.y > D, b0 = off ? 0 : H;
    const r = Math.max(0.6, Math.min(it.width, it.depth * 1.6) / 2), col = pal[(d.items.indexOf(it)) % pal.length];
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r, h * 0.7, 8), new THREE.MeshStandardMaterial({ color: 0x3a3350, roughness: 0.7, emissive: col, emissiveIntensity: 0.12 }));
    body.position.set(x, b0 + h * 0.35, z); scene.add(body);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 0.6, h * 0.3, 8), new THREE.MeshBasicMaterial({ color: col }));
    tip.position.set(x, b0 + h * 0.85, z); scene.add(tip);
    const band = new THREE.Mesh(new THREE.TorusGeometry(r * 0.8, 0.08, 6, 20), new THREE.MeshBasicMaterial({ color: col }));
    band.rotation.x = Math.PI / 2; band.position.set(x, b0 + h * 0.4, z); scene.add(band); continue;
  }
  if (it.kind === "label" || it.kind === "powerDrop" || it.kind === "diBox" || it.kind === "vocalMic" || it.kind === "iem") continue;
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.1, it.width), h, Math.max(0.1, it.depth)),
                           new THREE.MeshStandardMaterial({ color: kindColor[it.kind] ?? 0x2a2a33, roughness: 0.6 }));
  const isDeck = ["riser", "drumRiser", "bStage", "catwalk", "roundRiser", "stairs", "ramp"].includes(it.kind);
  m.position.set(x, (isDeck ? H : base) + h / 2 - (isDeck && it.y < 0 ? H : 0), z); m.rotation.y = -(it.rotation || 0) * Math.PI / 180; scene.add(m);
}
// Lights + beams
const beams = [];
for (const [i, f] of (d.fixtures || []).entries()) {
  const [x, z] = P(f.x, f.y); const y = H + (f.z || 7);
  const col = pal[i % pal.length];
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.35, 10), new THREE.MeshStandardMaterial({ color: 0x111111 }));
  body.position.set(x, y, z); scene.add(body);
  const len = y - H; const cone = new THREE.Mesh(new THREE.ConeGeometry(f.mover ? 0.9 : 1.6, len, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  cone.position.set(x, y - len / 2, z); scene.add(cone); beams.push({ cone, f, i, x, z });
  const spot = new THREE.PointLight(col, 1.2, 12); spot.position.set(x, H + 0.5, z); scene.add(spot);
}
addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  for (const b of beams) {
    if (b.f.mover) { b.cone.rotation.z = Math.sin(t * 0.8 + b.i) * 0.35; b.cone.rotation.x = Math.cos(t * 0.6 + b.i) * 0.2; }
    b.cone.material.opacity = 0.06 + 0.05 * (0.5 + 0.5 * Math.sin(t * 2 + b.i));
    b.cone.material.color.copy(pal[(Math.floor(t / 4) + b.i) % pal.length]);
  }
  ctl.update(); renderer.render(scene, cam);
})();
</script></body></html>
